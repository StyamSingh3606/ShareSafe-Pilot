services:
  - type: web
    name: sharesafe-pilot
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev
    startCommand: npm run dev
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BIND_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: sharesafe-pilot-db
          property: connectionString
      - key: LOCAL_WRAP_KEY
        sync: false
      - key: OTP_SECRET
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD_HASH
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: onboarding@resend.dev
      - key: ANDROID_CERT_SHA256
        sync: false
      - key: ANDROID_INSTALL_URL
        sync: false

databases:
  - name: sharesafe-pilot-db
    plan: free
    region: singapore
    ipAllowList: []
